<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike | Contact Us</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Nike Swoosh Logo" width="80" height="40">
        </div>
        
        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" placeholder="Search products..." onkeypress="if(event.key === 'Enter') { window.location.href='products.html'; }">
            <button type="button" onclick="window.location.href='products.html'">🔍</button>
        </div>

        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h1>Contact Us</h1>
            <p class="section-desc">Have questions or feedback? Reach out to our support team directly or visit our headquarters below.</p>
            
            <div class="contact-details">
                <p><strong>Email:</strong> support@nike.com</p>
                <p><strong>Phone:</strong> +27 11 123 4567</p>
            </div>

            <div class="map-container">
                <h3 style="margin-bottom: 10px;">Our Location</h3>
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3580.3705035222045!2d28.047305!3d-26.107567!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjbCsDA2JzI3LjMiUyAyOMKwMDInNTAuMyJF!5e0!3m2!1sen!2sza!4v1620000000000!5m2!1sen!2sza" 
                    width="100%" 
                    height="300" 
                    style="border:0; border-radius: 8px;" 
                    allowfullscreen="" 
                    loading="lazy">
                </iframe>
            </div>

            <form action="#" method="POST" onsubmit="alert('Message sent successfully! We will get back to you soon.');">
                <label for="contact-name">Your Name:</label>
                <input type="text" id="contact-name" name="name" required>

                <label for="contact-email">Your Email:</label>
                <input type="email" id="contact-email" name="email" required>

                <label for="contact-msg">Message:</label>
                <textarea id="contact-msg" name="message" rows="4" required></textarea>

                <button type="submit" class="cta-button">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Nike, Inc. All Rights Reserved.</p>
    </footer>
</body>
</html>
